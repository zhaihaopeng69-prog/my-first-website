
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam | Personal Website</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #141e30, #49318d, #e94091);
    background-size: 300% 300%;
    animation: bgMove 7s infinite alternate;
  }

  @keyframes bgMove {
    from { background-position: left top; }
    to { background-position: right bottom; }
  }

  .card {
    box-sizing: border-box;
    padding: 50px 35px;
    width: min(85%, 580px);
    border-radius: 25px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
  }

  h1 {
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.5;
  }

  p {
    font-size: 18px;
    opacity: 0.9;
  }

  .divider {
    width: 65%;
    height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 30px auto;
  }

  h2 {
    font-size: 21px;
    font-weight: 500;
  }

  .english {
    font-size: 15px;
    line-height: 1.8;
    opacity: 0.8;
  }

  button {
    margin-top: 25px;
    padding: 15px 32px;
    font-size: 16px;
    background: white;
    color: #49318d;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.1);
    background: #ffdf69;
  }
</style>
</head>

<body>

  <div class="card">

    <h1>✨ 欢迎来到 Liam 的个人网站</h1>

    <p>其他内容，敬请期待。</p>

    <div class="divider"></div>

    <h2>Welcome to Liam's Personal Website</h2>

    <p class="english">
      More exciting content is coming soon.<br>
      Stay tuned!
    </p>

    <button onclick="showMessage()">✨ Coming Soon</button>

  </div>

<script>
  function showMessage() {
    alert("Liam's website is under construction. Stay tuned! 🚀");
  }
</script>

</body>
</html>
